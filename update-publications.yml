name: Update Publications from ORCID

on:
  schedule:
    # Runs at 00:00 UTC on the 1st, 6th, 11th, 16th, 21st, and 26th of each
    # month — the closest cron approximation of "every 5 days" (cron has no
    # native "every N days" interval, so this isn't perfectly exact, but it
    # stays close throughout the month). Adjust if you want a different cadence.
    - cron: '0 0 1,6,11,16,21,26 * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest publications from ORCID
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python scripts/fetch_orcid.py

      - name: Commit updated publications.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-update publications from ORCID'
          file_pattern: publications.json
